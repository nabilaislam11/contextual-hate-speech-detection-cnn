name: Academic research file validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PDF and Markdown links
        run: python scripts/validate_research.py
      - name: Compile CNN source files
        run: python -m py_compile src/train.py src/predict.py
